name: BeaverClone
options:
  bundleIdPrefix: com.example
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
targets:
  BeaverCloneKit:
    type: framework
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "16.0"
      macOS: "13.0"
    sources: [BeaverCloneKit]
    info:
      path: BeaverCloneKit/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.beaverclonekit"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BeaverCloneKit/Info.plist

  BeaverCloneiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [BeaverCloneiOS]
    dependencies:
      - target: BeaverCloneKit_iOS
        embed: true
    info:
      path: BeaverCloneiOS/Info.plist
      properties:
        CFBundleDisplayName: "Beaver"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Beaver needs microphone access to record and transcribe your notes."
        NSSpeechRecognitionUsageDescription: "Beaver uses speech recognition to transcribe your recordings."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: BeaverCloneiOS/BeaverCloneiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.example.beaverclone
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.example.beaverclone"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.example.beavercloneios"
    settings:
      base:
        INFOPLIST_FILE: BeaverCloneiOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.beavercloneios"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  BeaverCloneMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [BeaverCloneMac]
    dependencies:
      - target: BeaverCloneKit_macOS
        embed: true
    info:
      path: BeaverCloneMac/Info.plist
      properties:
        CFBundleDisplayName: "Beaver"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Beaver needs microphone access to record and transcribe your notes."
        NSSpeechRecognitionUsageDescription: "Beaver uses speech recognition to transcribe your recordings."
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: BeaverCloneMac/BeaverCloneMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.example.beaverclone
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.example.beaverclone"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.example.beaverclonemac"
    settings:
      base:
        INFOPLIST_FILE: BeaverCloneMac/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.beaverclonemac"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        COMBINE_HIDPI_IMAGES: YES

  BeaverCloneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [BeaverCloneUITests]
    dependencies:
      - target: BeaverCloneiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.beavercloneuitests"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: BeaverCloneiOS

schemes:
  BeaverCloneiOS:
    build:
      targets:
        BeaverCloneiOS: all
        BeaverCloneUITests: [test]
    test:
      config: Debug
      targets:
        - BeaverCloneUITests
    run:
      config: Debug
  BeaverCloneMac:
    build:
      targets:
        BeaverCloneMac: all
    run:
      config: Debug
